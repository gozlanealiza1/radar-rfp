# =====================================================================
#  Radar RFP Globecast : réglages
#  C'est le SEUL fichier à modifier pour ajuster la veille.
#  (Sur GitHub : ouvrir le fichier > icône crayon > modifier > "Commit changes")
#
#  Attention à la syntaxe : chaque ligne de liste commence par "- "
#  (un tiret PUIS un espace), avec la même indentation que les autres.
# =====================================================================

titre: "Radar RFP Globecast"

# ---------------------------------------------------------------------
# 1. COMMENT UN AVIS EST RETENU : système de points
#    - mot-clé FORT trouvé       = 3 points
#    - mot-clé FAIBLE trouvé     = 1 point chacun
#    - code CPV broadcast        = 2 ou 3 points (voir plus bas)
#    Un avis est affiché s'il atteint le SEUIL.
#    => un mot fort suffit ; un mot faible seul ne suffit JAMAIS.
# ---------------------------------------------------------------------
seuil: 3

# Mots forts : spécifiques au métier Globecast, un seul suffit
# (FR et EN : les sites anglais, comme le Royaume-Uni et les US, n'ont pas de français)
mots_cles_forts:
  # Français
  - playout
  - téléport
  - liaison satellite
  - liaisons satellite
  - transmission satellite
  - capacité satellite
  - segment spatial
  - flux de chaînes
  - transport de flux
  - transport vidéo
  - contribution vidéo
  - distribution de chaînes
  - diffusion de chaînes
  - diffusion des chaînes
  - diffusion télévisuelle
  - tête de réseau
  - encodage vidéo
  - régie de diffusion
  - régie finale
  - car régie
  - car-régie
  - diffusion satellite
  - diffusion par satellite
  - plateforme ott
  - diffusion ott
  - distribution ott
  - retransmission en direct
  - multidiffusion
  # Anglais
  - teleport
  - satellite uplink
  - satellite downlink
  - satellite capacity
  - space segment
  - video transport
  - live feed
  - live feeds
  - channel distribution
  - channel origination
  - channel playout
  - broadcast services
  - broadcast operations
  - broadcast infrastructure
  - headend
  - head-end
  - master control
  - outside broadcast
  - host broadcast
  - host broadcaster
  - cloud playout
  - playout cloud
  - ott platform
  - ott delivery

# Mots faibles : utiles mais ambigus ; ils ne comptent que combinés
# (2 mots faibles, ou 1 mot faible + un code CPV broadcast)
mots_cles_faibles:
  - broadcast
  - broadcaster
  - flux vidéo
  - flux live
  - diffusion tv
  - transcodage
  - transcoding
  - captation vidéo
  - live streaming
  - video streaming
  - streaming
  - ott
  - iptv
  - dvb
  - srt
  - satellite
  - uplink
  - downlink
  - chaîne de télévision
  - chaîne tv
  - television channel
  - tv channel
  - multiplex

# Mots qui ÉCARTENT TOUJOURS un avis (bruit fréquent)
mots_exclus:
  # publicité / achat d'espace
  - régie publicitaire
  - achat d'espace
  - achat d'espaces
  # vidéosurveillance (gros pourvoyeur de "flux vidéo")
  - vidéoprotection
  - vidéo-protection
  - vidéosurveillance
  - video surveillance
  - cctv
  # captation des conseils municipaux, événements locaux
  - conseil municipal
  - conseils municipaux
  - conseil communautaire
  - séances du conseil
  - assemblée délibérante
  # télévision dans les hôpitaux, hôtels, EHPAD
  - téléviseurs
  - location de télévision
  - télévision des patients
  - patients
  # cinéma
  - cinéma
  - salle de cinéma
  # divers
  - nettoyage
  - gardiennage
  - restauration collective

# ---------------------------------------------------------------------
# 2. Codes CPV (nomenclature des marchés publics)
# ---------------------------------------------------------------------
# Envoyés tels quels à TED pour élargir la collecte
codes_cpv:
  - "64228000"   # Transmission de programmes de télévision et de radio
  - "64228100"   # Transmission de programmes de télévision
  - "64228200"   # Transmission de programmes radio
  - "92200000"   # Services de radio et de télévision
  - "92220000"   # Services de télévision
  - "92221000"   # Production de télévision
  - "92224000"   # Télévision numérique
  - "92225000"   # Télévision interactive
  - "92226000"   # Téléprogrammation
# Points accordés selon le début du code (le plus long qui correspond l'emporte)
poids_cpv:
  "64228": 3     # transmission TV/radio : suffit à lui seul
  "9222": 3      # services de télévision : suffit à lui seul
  "9221": 1      # radio : à combiner
  "922": 2       # radio et TV (générique) : à combiner avec un mot faible

# ---------------------------------------------------------------------
# 3. Comptes cibles
#    Leurs avis sont remontés dès qu'ils ont au moins 1 point
#    (mettre comptes_cibles_tout: true pour TOUT voir, même hors sujet)
# ---------------------------------------------------------------------
comptes_cibles_tout: false
comptes_cibles:
  - nom: "TV5MONDE"
    noms: ["tv5monde", "tv5 monde"]
  - nom: "France Médias Monde"
    noms: ["france medias monde", "france médias monde", "france 24", "monte carlo doualiya", "francemm"]
  - nom: "beIN"
    noms: ["bein", "bein media group", "bein sports"]
  - nom: "Canal+"
    noms: ["canal+", "canal plus", "groupe canal"]

# ---------------------------------------------------------------------
# 4. Sites surveillés (Dematis, plateformes d'achat, sites de prospects...)
#    Le radar ouvre chaque page tous les matins et signale les NOUVEAUX liens.
#    - filtre: mots_cles  -> le lien doit atteindre le seuil de points
#                            (1 point suffit si la page a un "compte")
#    - filtre: tout       -> TOUTE nouvelle consultation est remontée, même hors sujet
#    - motif_lien (optionnel) : ne garder que les liens contenant ce texte
#    - compte (optionnel) : rattache les résultats à un compte cible
#    Pour ajouter un prospect : copier un bloc de 4 lignes et changer nom + url
#    (prendre la page "Appels d'offres / Tenders / Fournisseurs" de son site).
# ---------------------------------------------------------------------
pages_a_surveiller:
  - nom: "TV5MONDE (plateforme Dematis)"
    url: "https://tv5.e-marchespublics.com/"
    filtre: mots_cles
    motif_lien: "annonce_marche_public"
    compte: "TV5MONDE"
  - nom: "Dematis : annonces récentes"
    url: "https://www.e-marchespublics.com/appel-offre"
    filtre: mots_cles
  - nom: "France Télévisions (plateforme achats)"
    url: "https://www.appel-offres.francetelevisions.fr/?page=Entreprise.EntrepriseAdvancedSearch&AllCons"
    filtre: mots_cles
  # Exemple à compléter : page "Tenders" de beIN (coller l'adresse exacte)
  # - nom: "beIN (tenders)"
  #   url: "https://..."
  #   filtre: mots_cles
  #   compte: "beIN"

# ---------------------------------------------------------------------
# 5. Signaux presse (Google Actualités) : pour les acteurs privés
#    Un article n'est gardé que si son titre parle vraiment d'appel d'offres
# ---------------------------------------------------------------------
recherches_presse:
  - 'beIN "invitation to tender"'
  - 'beIN tender broadcast'
  - '"Canal+" "appel d''offres"'
  - '"Canal+" tender broadcast'
  - '"appel d''offres" playout'
  - 'RFP playout broadcaster'
  - '"request for proposal" playout'
  - 'host broadcaster tender'
presse_mots_obligatoires:
  - appel d'offres
  - appel d'offre
  - appels d'offres
  - consultation
  - tender
  - tenders
  - rfp
  - rfi
  - rfq
  - request for proposal
  - invitation to tender
  - procurement
  - bid

# ---------------------------------------------------------------------
# 6. Sources activées (true = oui, false = non)
# ---------------------------------------------------------------------
sources:
  ted: true            # Europe (Journal officiel de l'UE)
  boamp: true          # France
  find_a_tender: true  # Royaume-Uni
  sam_gov: true        # États-Unis (ne s'active que si une clé SAM_API_KEY est fournie)
  sites: true          # Sites surveillés (section 4)
  presse: true         # Google Actualités

# Historique récupéré au tout premier lancement (en jours)
premier_lancement_jours:
  ted: 60
  ted_comptes_cibles: 365
  boamp: 14
  find_a_tender: 7
  sam_gov: 30

# Les avis plus vieux que ça disparaissent de la page (en jours)
conservation_jours: 400
